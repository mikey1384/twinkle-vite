<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quest Jukebox</title>
<style>
  body { margin: 0; background: #151a2b; color: #e8ecf6; font: 15px/1.45 -apple-system, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 18px 14px 40px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #9aa6c4; margin-bottom: 16px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #1f2640; margin-bottom: 8px; }
  .row.on { outline: 2px solid #ffcb32; }
  .name { flex: 1; }
  .name b { display: block; }
  .meta { color: #9aa6c4; font-size: 13px; }
  button { font: inherit; padding: 7px 11px; border-radius: 8px; border: 1px solid #3a4466; background: #2a3354; color: #fff; cursor: pointer; }
  .missing { opacity: .45; }
  .now { position: sticky; top: 0; background: #151a2b; padding: 8px 0 12px; display: flex; gap: 10px; align-items: center; }
  .bar { flex: 1; height: 8px; border-radius: 4px; background: #2a3354; position: relative; }
  .fill { position: absolute; inset: 0 auto 0 0; background: #ffcb32; border-radius: 4px; }
  .loopmark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: #ff6b8a; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Grammar Quest jukebox</h1>
  <div class="sub">Each track plays its intro once, then loops forever. "Seam" jumps to 6 s before the loop point so you can hear it wrap.</div>
  <div class="now"><button id="stop">■ Stop</button><span id="nowName">Nothing playing</span><div class="bar"><div class="fill" id="fill"></div><div class="loopmark" id="mark"></div></div><span id="time" class="meta"></span></div>
  <div id="list"></div>
</div>
<script type="module" src="./music-lab.ts"></script>
</body>
</html>
