<!DOCTYPE html>
<html translate="no">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1"
    />
    <!-- share-meta:start (scripts/hostPages.mjs swaps this block for lumine.html) -->
    <meta name="description" content="Filling Minds with Wonder" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Twinkle Network" />
    <meta property="og:title" content="Twinkle Network" />
    <meta property="og:description" content="Filling Minds with Wonder" />
    <meta property="og:image" content="https://www.twin-kle.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Twinkle Network" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Twinkle Network" />
    <meta name="twitter:description" content="Filling Minds with Wonder" />
    <meta name="twitter:image" content="https://www.twin-kle.com/og-image.png" />
    <!-- share-meta:end -->
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600&family=Baloo+2:wght@400;700&family=Orbitron&family=Montserrat:wght@400;500;700&family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,100;0,300;0,500;1,100&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital@0;1&family=Lato:wght@300;400;700&display=swap&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <title>Twinkle</title>
    <script>
      // lumine.network serves this same site under its own name. Swap the tab
      // title, icon, and install manifest before first paint so the tab never
      // shows Twinkle there (src/constants/siteBrand.ts covers in-app copy).
      (function () {
        if (!/(^|\.)lumine\.network$/.test(window.location.hostname)) return;
        document.title = 'Lumine';
        var icon = document.querySelector('link[rel="icon"]');
        if (icon) {
          icon.setAttribute('type', 'image/svg+xml');
          icon.setAttribute('href', '/lumine-favicon.svg');
        }
        var manifest = document.querySelector('link[rel="manifest"]');
        if (manifest) manifest.setAttribute('href', '/lumine-manifest.json');
        var metas = document.querySelectorAll(
          'meta[property="og:title"], meta[name="twitter:title"]'
        );
        for (var i = 0; i < metas.length; i++) {
          metas[i].setAttribute('content', 'Lumine');
        }
      })();
    </script>
    <script defer src="/js/load-image.all.min.js"></script>
    <!-- Google tag (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      (function () {
        // Load production analytics only on Twinkle's public website hosts.
        // Vite preview builds also have import.meta.env.PROD=true, so a local-
        // hostname denylist would still let Vercel preview/staging traffic
        // pollute the production property. /app-capture remains excluded
        // because it is the server's thumbnail capture browser. A Twinkle
        // content page owns analytics for its same-origin embedded app frame,
        // avoiding two GA documents measuring the same foreground time.
        var host = window.location.hostname;
        var isProductionWebsiteHost =
          host === 'www.twin-kle.com' ||
          host === 'www.twinkle.network' ||
          host === 'www.lumine.network';
        var isCaptureBrowser =
          window.location.pathname.indexOf('/app-capture') === 0;
        var isSameOriginEmbeddedBuildApp = false;
        try {
          isSameOriginEmbeddedBuildApp =
            window.self !== window.top &&
            window.location.pathname.indexOf('/app/') === 0 &&
            new URLSearchParams(window.location.search).get('embedded') ===
              '1' &&
            window.parent.location.origin === window.location.origin;
        } catch (_error) {
          // Cross-origin embeds have no Twinkle parent analytics owner.
        }
        // Automated browsers (agent Build reviews, render checks, headless
        // capture) are not visitors. Headless Chrome reports webdriver.
        var isAutomatedBrowser = false;
        try {
          isAutomatedBrowser =
            (typeof navigator !== 'undefined' &&
              (navigator.webdriver === true ||
                /HeadlessChrome/.test(navigator.userAgent || ''))) ||
            window.localStorage.getItem('twinkle-analytics-opt-out') === '1';
        } catch (_error) {
          // Storage can be blocked; the navigator checks above still ran.
        }
        // Every URL GA receives goes through this: secrets in links (password
        // reset and email tokens, a guardian's consent token, CLI login codes,
        // invite passes, payment session ids) must never reach Google. Only
        // known-safe query parameters survive, token path segments become
        // ':token', the hash is dropped, and an outside referrer keeps only
        // its origin. src/helpers/analytics.ts uses this for every page view.
        var SAFE_QUERY_PARAMS = {
          cardId: 1, choice: 1, crew: 1, embedded: 1, id: 1, lang: 1,
          mount: 1, mountId: 1, mountType: 1, notificationId: 1, owner: 1,
          page: 1, previewPath: 1, promptId: 1, q: 1, review: 1,
          rewardReview: 1, sayHi: 1, sort: 1, subjectId: 1, tab: 1, v: 1,
          view: 1
        };
        var TOKEN_PATH_PREFIXES = ['/reset/password/', '/verify/email/'];
        window.twinkleAnalyticsUrl = function (input) {
          var url;
          try {
            url = new URL(String(input || '/'), window.location.origin);
          } catch (_error) {
            return window.location.origin + '/';
          }
          if (url.origin !== window.location.origin) return url.origin + '/';
          var path = url.pathname;
          for (var i = 0; i < TOKEN_PATH_PREFIXES.length; i++) {
            if (path.indexOf(TOKEN_PATH_PREFIXES[i]) === 0) {
              path = TOKEN_PATH_PREFIXES[i] + ':token';
            }
          }
          path = path
            .split('/')
            .map(function (segment) {
              return segment.length >= 24 && /[.+]/.test(segment)
                ? ':token'
                : segment;
            })
            .join('/');
          var kept = [];
          url.searchParams.forEach(function (value, key) {
            if (SAFE_QUERY_PARAMS[key] === 1 || /^utm_[a-z_]+$/.test(key)) {
              kept.push(
                encodeURIComponent(key) + '=' + encodeURIComponent(value)
              );
            }
          });
          return (
            window.location.origin + path + (kept.length ? '?' + kept.join('&') : '')
          );
        };
        window.twinkleAnalyticsEnabled =
          isProductionWebsiteHost &&
          !isCaptureBrowser &&
          !isSameOriginEmbeddedBuildApp &&
          !isAutomatedBrowser;
        window.twinkleAnalyticsIdentityReady = true;
        window.twinkleConfigureAnalytics = function () {};
        if (!window.twinkleAnalyticsEnabled) return;
        var cachedUserId = 0;
        try {
          cachedUserId = Number(window.localStorage.getItem('userId')) || 0;
        } catch (_error) {
          // If storage is unavailable, the app cannot hydrate a cached user.
        }
        window.twinkleAnalyticsIdentityReady = !cachedUserId;
        var analyticsConfigured = false;
        window.twinkleConfigureAnalytics = function () {
          if (analyticsConfigured) return;
          analyticsConfigured = true;
          gtag('config', 'G-S5ZDMC9JF8', {
            // Without this gtag would attach the raw address bar to every
            // hit; the app then sets the cleaned URL on each page view.
            page_location: window.twinkleAnalyticsUrl(window.location.href),
            page_referrer: document.referrer
              ? window.twinkleAnalyticsUrl(document.referrer)
              : undefined,
            send_page_view: false,
            allow_google_signals: false,
            allow_ad_personalization_signals: false
          });
        };
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-S5ZDMC9JF8';
        document.head.appendChild(script);
        gtag('js', new Date());
        if (window.twinkleAnalyticsIdentityReady) {
          window.twinkleConfigureAnalytics();
        }
      })();
    </script>
    <style id="animation"></style>
  </head>

  <body class="notranslate" translate="no">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="react-view" class="notranslate" translate="no"></div>
    <div id="modal" class="notranslate" translate="no"></div>
    <div id="outer-layer" class="notranslate" translate="no"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
