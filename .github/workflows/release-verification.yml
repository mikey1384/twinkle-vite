name: Website release verification

on:
  push:
    branches: ['release-verification/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Install frozen dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: NODE_OPTIONS=--max-old-space-size=3072 npm run typecheck
      - name: Lint the reward bridge
        run: node_modules/.bin/eslint src/containers/Build/PreviewPanel/hooks/useHostBridge.ts
      - name: Verify reward bridge behavior
        run: NODE_OPTIONS=--max-old-space-size=512 node_modules/.bin/tsx --test --test-concurrency=1 test/buildRewardsBridge.test.ts
